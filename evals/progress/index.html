<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eval HQ</title>
  <style>
    main.progress { max-width: 1240px; margin: 0 auto; padding: 16px 20px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
    main.progress > .wide { grid-column: 1 / -1; }
    main.progress .chart { min-width: 0; }
    .trio { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .legend i { display: inline-block; width: 18px; margin-right: 5px; vertical-align: middle; }
    .strip { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
    .strip b { font: 17px Excalifont, cursive; }
    .meter { position: relative; display: inline-block; width: 80px; height: 8px; border: 1px solid var(--ink); border-radius: 4px; vertical-align: middle; overflow: hidden; }
    .meter > span { display: block; height: 100%; background: var(--accent); }
    .meter > i { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
    .meter.over > span { background: #c92a2a; }
    .scroll { overflow-x: auto; }
    table.marks tr[data-decision] { cursor: pointer; }
    table.marks tr[data-decision]:hover { background: #fff4e6; }
    .drill { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); height: 100%; }
    .drill > div { overflow: auto; padding: 10px 14px; }
    .drill img { max-width: 100%; border: 1.5px solid var(--ink); border-radius: 6px; }
    .drill .shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    @media (max-width: 700px) { .drill { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
    .needs-wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 0; display: grid; gap: 14px; }
    .pipeline { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .pipeline .stage-link { display: grid; gap: 2px; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; color: inherit; text-decoration: none; min-width: 0; }
    .pipeline .stage-link:hover { background: #fff4e6; }
    .pipeline b { font: 17px Excalifont, cursive; overflow-wrap: anywhere; }
    main.progress > .view { padding-top: 6px; }
    main.progress > .view h2 { font: 24px Excalifont, cursive; margin: 0; }
    main.progress > .view p { margin: 2px 0 0; }
    #needs { border: 2.5px solid var(--bad); overflow-wrap: anywhere; }
    #needs.quiet { border: 1.5px dashed var(--line); padding: 8px 12px; }
    #needs.quiet h2 { font-size: 16px; color: var(--muted); }
    #needs .grow { flex: 1; }
    #needs .blurb { margin: 0 0 6px; }
    #needs .badge { display: inline-block; min-width: 26px; padding: 1px 8px; border-radius: 999px; background: var(--bad); color: #fff; font: 600 16px system-ui, sans-serif; text-align: center; vertical-align: 2px; }
    #needs ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    #needs h3 { margin: 6px 0 0; font: 16px Excalifont, cursive; }
    #needs .item { border: 1.5px solid var(--line); border-left: 6px solid var(--accent); border-radius: 8px; padding: 8px 10px; display: grid; gap: 5px; }
    #needs .item.held { border-left-color: var(--bad); background: #fff5f5; }
    #needs .item.answered { border-left-color: var(--line); }
    #needs .item.answered .what { font-weight: 400; }
    #needs .what { margin: 0; font-size: 15px; font-weight: 600; }
    #needs .why { margin: 0; padding-left: 18px; color: var(--muted); }
    #needs .chip { font: 11px var(--mono); padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
    #needs .chip.held { background: var(--bad); border-color: var(--bad); color: #fff; }
    #needs .chip.reply { background: #e7f5ff; border-color: #1971c2; color: #1971c2; }
    #needs .note { border-left: 3px solid var(--line); padding: 1px 8px; }
    #needs .note.claude { border-left-color: #1971c2; }
    #needs .note .text { white-space: pre-wrap; }
    #needs .acts button, #needs .acts a { font-size: 12px; padding: 2px 8px; }
    #needs textarea { font: 14px/1.45 system-ui, sans-serif; }
    #needs details summary { cursor: pointer; }
  </style>
</head>
<body>
  <div class="needs-wrap"><section class="card" id="overview"></section><section class="card" id="needs" hidden></section></div>
  <main class="progress" id="panels"></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
