<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eval HQ · intake and review</title>
  <style>
    main.review { max-width: 1240px; margin: 0 auto; padding: 16px 20px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
    main.review > .wide { grid-column: 1 / -1; }
    .funnel { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }
    .funnel b { font: 22px Excalifont, cursive; margin-right: 4px; }
    .chip { font: 11px var(--mono); padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
    .chip.proposed { border-color: var(--accent); color: var(--accent); }
    .chip.admitted { border-color: var(--ok); color: var(--ok); }
    .chip.rejected { border-color: var(--bad); color: var(--bad); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .queue { display: grid; gap: 6px; }
    .queue button.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; text-align: left; align-items: baseline; padding: 8px 10px; background: #fff; }
    .queue button.item:hover, .queue button.item:focus-visible { background: #fff4e6; }
    .queue .said { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue .meta { grid-column: 2 / -1; font-size: 12px; }
    kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin: 0 2px; }
    .grow { flex: 1; }
    /* The reviewer is the page while it's open: the page scrolls, never a panel in it; the bars stay put. */
    body.reviewing > :not(.reviewer) { display: none; }
    .reviewer [hidden] { display: none !important; }
    .reviewer { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
    .rv-bar, .rv-acts { position: sticky; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 20px; background: var(--panel); }
    .rv-bar { top: 0; border-bottom: 1px solid var(--line); }
    .rv-acts { bottom: 0; border-top: 1px solid var(--line); box-shadow: 0 -6px 14px -10px #0003; }
    .rv-bar b { font: 22px Excalifont, cursive; }
    .rv-meter { width: 140px; height: 8px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
    .rv-meter > span { display: block; height: 100%; background: var(--accent); }
    .rv-last { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rv-do { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
    .rv-last.bad { color: var(--bad); }
    .rv-keys { margin-left: auto; font-size: 12px; }
    .rv-acts button { padding: 4px 9px; }
    .rv-acts button.on { border-color: var(--bad); color: var(--bad); }
    .rv-main { flex: 1; display: grid; grid-template: "shots side" auto "more side" 1fr / minmax(0, 1.6fr) minmax(360px, 1fr); gap: 12px 28px; align-items: start; padding: 14px 20px 16px; }
    .rv-shots { grid-area: shots; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .rv-shots figure { margin: 0; display: grid; gap: 3px; min-width: 0; align-content: start; }
    .rv-shots figcaption { font: 15px Excalifont, cursive; color: var(--muted); }
    .rv-shots img, .rv-shots .none { width: 100%; aspect-ratio: 16 / 10; border-radius: 6px; }
    .rv-shots img { object-fit: contain; border: 1px solid var(--line); background: #fff; cursor: zoom-in; }
    .rv-shots .none { display: grid; place-items: center; text-align: center; border: 1.5px dashed var(--line); color: var(--muted); }
    .rv-side { grid-area: side; display: grid; gap: 10px; min-width: 0; max-width: 64ch; }
    .rv-side p, .rv-side ul { margin: 0; }
    .rv-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12px; }
    .words { font-size: 20px; line-height: 1.4; }
    .words.long { font-size: 16px; }
    .rv-more { grid-area: more; display: grid; gap: 4px; font-size: 13px; }
    .rv-more p { margin: 0; }
    .rv-side section { display: grid; gap: 2px; }
    .rv-side h3 { margin: 0; font: 15px Excalifont, cursive; color: var(--muted); }
    .rv-side h4 { margin: 6px 0 0; font: 600 12px system-ui, sans-serif; color: var(--muted); }
    .rv-list { padding: 0; list-style: none; display: grid; }
    .rv-list li { display: flex; gap: 6px; }
    .rv-list li::before { content: "✓"; color: var(--ok); line-height: 1.4; padding-top: 2px; }
    .rv-list.mustNot li::before { content: "✕"; color: var(--bad); }
    /* Fields grow with their words and look like text until they're hovered or focused. */
    .rv-side textarea { field-sizing: content; width: 100%; min-height: 0; resize: none; overflow: hidden; font: 15px/1.4 system-ui, sans-serif; padding: 2px 6px; margin: 0 -6px; border: 1px solid transparent; border-radius: 6px; background: transparent; }
    .rv-list textarea { margin: 0; }
    .rv-side textarea:hover { border-color: var(--line); }
    .rv-side textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
    .rv-side textarea[data-note] { font-size: 13px; }
    .rv-more details table { margin-top: 4px; }
    .rv-more code { overflow-wrap: anywhere; }
    .rv-zoom { position: fixed; inset: 0; z-index: 5; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 12px 16px 16px; background: #1e1e1ee6; cursor: zoom-out; }
    .rv-zoom p { margin: 0 0 8px; color: #fff; font: 18px Excalifont, cursive; }
    .rv-zoom p .muted { color: #ccc; font: 13px system-ui, sans-serif; }
    .rv-zoom img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    .rv-wait, .rv-done { grid-column: 1 / -1; align-self: center; justify-self: center; text-align: center; }
    .rv-done h2 { font: 28px Excalifont, cursive; margin: 0 0 6px; }
    @media (max-width: 900px) {
      .rv-main { grid-template: "shots" "side" "more" / minmax(0, 1fr); padding: 12px 16px; }
      .rv-keys { display: none; }
    }
    .chart { min-width: 0; }
  </style>
</head>
<body>
  <main class="review" id="panels"></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
