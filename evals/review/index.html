<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eval HQ · intake and review</title>
  <style>
    main.review { max-width: 1240px; margin: 0 auto; padding: 16px 20px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
    main.review > .wide { grid-column: 1 / -1; }
    .funnel { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }
    .funnel b { font: 22px Excalifont, cursive; margin-right: 4px; }
    .chip { font: 11px var(--mono); padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
    .chip.proposed { border-color: var(--accent); color: var(--accent); }
    .chip.admitted { border-color: var(--ok); color: var(--ok); }
    .chip.rejected { border-color: var(--bad); color: var(--bad); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .queue { display: grid; gap: 6px; }
    .queue button.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; text-align: left; align-items: baseline; padding: 8px 10px; background: #fff; }
    .queue button.item:hover, .queue button.item:focus-visible { background: #fff4e6; }
    .queue .said { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue .meta { grid-column: 2 / -1; font-size: 12px; }
    .words { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 16px; }
    .words span i { font: 11px var(--mono); color: var(--muted); font-style: normal; margin-right: 3px; }
    kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin: 0 2px; }
    .grow { flex: 1; }
    body.reviewing { overflow: hidden; }
    .reviewer [hidden] { display: none !important; }
    .reviewer { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .rv-bar, .rv-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 16px; background: var(--panel); }
    .rv-bar { border-bottom: 1.5px solid var(--ink); }
    .rv-acts { border-top: 1.5px solid var(--ink); }
    .rv-bar b { font: 22px Excalifont, cursive; }
    .rv-meter { width: 140px; height: 8px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
    .rv-meter > span { display: block; height: 100%; background: var(--accent); }
    .rv-last { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rv-do { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
    .rv-last.bad { color: var(--bad); }
    .rv-keys { margin-left: auto; font-size: 12px; }
    .rv-acts button { padding: 4px 9px; }
    .rv-acts button.on { border-color: var(--bad); color: var(--bad); }
    .rv-main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); gap: 14px; padding: 12px 16px; min-height: 0; }
    .rv-shots { display: grid; grid-template: repeat(2, minmax(0, 1fr)) / repeat(2, minmax(0, 1fr)); gap: 10px; min-height: 0; }
    .rv-shots figure { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 3px; min-width: 0; min-height: 0; }
    .rv-shots figcaption { font: 15px Excalifont, cursive; }
    .rv-shots img { width: 100%; height: 100%; min-height: 0; box-sizing: border-box; object-fit: contain; border: 1.5px solid var(--ink); border-radius: 6px; background: #fff; cursor: zoom-in; }
    .rv-shots .none { display: grid; place-items: center; text-align: center; border: 1.5px dashed var(--line); border-radius: 6px; color: var(--muted); }
    .rv-side { display: grid; gap: 8px; align-content: start; min-height: 0; overflow: auto; padding-right: 4px; }
    .rv-side section { display: grid; gap: 4px; }
    .rv-side h3 { margin: 4px 0 0; font: 17px Excalifont, cursive; }
    .rv-side p { margin: 0; }
    .rv-side textarea { font: 14px/1.45 system-ui, sans-serif; }
    .rv-zoom { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 12px 16px 16px; background: #1e1e1ee6; cursor: zoom-out; }
    .rv-zoom p { margin: 0 0 8px; color: #fff; font: 18px Excalifont, cursive; }
    .rv-zoom p .muted { color: #ccc; font: 13px system-ui, sans-serif; }
    .rv-zoom img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    .rv-wait, .rv-done { grid-column: 1 / -1; align-self: center; justify-self: center; text-align: center; }
    .rv-done h2 { font: 28px Excalifont, cursive; margin: 0 0 6px; }
    @media (max-width: 900px) {
      .rv-main { grid-template-columns: 1fr; grid-auto-rows: max-content; overflow: auto; }
      .rv-shots { grid-template-rows: repeat(2, 34vh); }
      .rv-side { overflow: visible; }
      .rv-keys { display: none; }
    }
    .chart { min-width: 0; }
  </style>
</head>
<body>
  <main class="review" id="panels"></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
