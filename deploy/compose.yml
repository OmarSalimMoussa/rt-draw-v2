# rt-draw on the EmberHub box: its own project, network, volume and loopback port. The box's
# edge reaches it through /srv/edge/sites/rtdraw.caddy, which scripts/deploy.sh writes. This is
# v2's app in v1's place: same project, container and port, its own volume (v1's rtdraw-data
# stays as it was).
name: rtdraw

services:
  app:
    image: rtdraw:${RTDRAW_TAG:?}
    container_name: rtdraw-app
    restart: unless-stopped
    # Keys come from the box's one shared /srv/emberhub.env (described in /srv/KEYS.md), which compose
    # reads through the .env link beside this file. The app gets only the keys named here: never
    # ANTHROPIC_API_KEY, which the Claude SDK would use over the subscription's token.
    environment:
      # Invite links are made with this address.
      PUBLIC_URL: https://imagine.emberhub.dev
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:?}
      # The mailer (deploy/README.md); without it the admin page shows each link to copy.
      MAILER_URL: ${MAILER_URL:-}
      MAILER_SECRET: ${MAILER_SECRET:-}
    ports:
      - "127.0.0.1:8700:8200"
    volumes:
      - rtdraw-v2-data:/data
    # Other apps share this machine; rt-draw must not starve them.
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8200/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  rtdraw-v2-data:
    name: rtdraw-v2-data
